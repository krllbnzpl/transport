<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Бронирование парковки — игра на скорость реакции</title>
<meta name="description" content="Каждую минуту ровно в :00 дата на неделю вперёд доступна 5 секунд. Успей выбрать её и нажать «Забронировать» в первые 1,5 секунды!" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --green:#2FC553; --green-dark:#29B44A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:#fff; color:#1c1c1c; -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; }

  /* ───── фон-карта ───── */
  .map-bg { position:fixed; inset:0; z-index:-10; overflow:hidden; user-select:none; pointer-events:none; }
  .map-bg svg { width:100%; height:100%; }
  .map-haze { position:absolute; inset:0; background:rgba(255,255,255,.25); }

  main { min-height:100vh; max-width:440px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; padding:40px 16px; position:relative; }
  .card {
    background:rgba(255,255,255,.95); backdrop-filter:blur(8px);
    border-radius:16px; padding:24px;
    box-shadow:0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
  }
  h1 { font-size:20px; font-weight:800; letter-spacing:-.025em; }
  .label { font-size:13px; color:#9ca3af; display:block; }
  .mt16 { margin-top:16px; }
  .mt20 { margin-top:20px; }

  /* ───── выбор адреса ───── */
  .addr-wrap { position:relative; }
  .sel-trigger {
    margin-top:6px; height:48px; width:100%; border:1px solid #e5e7eb; border-radius:12px;
    background:#fff; padding:0 12px; font-size:16px; display:flex; align-items:center;
    justify-content:space-between; cursor:pointer; color:#1c1c1c;
  }
  .sel-trigger:hover { border-color:#d1d5db; }
  .sel-trigger .chev { transition:transform .2s; color:#6b7280; flex:none; }
  .sel-trigger.open .chev { transform:rotate(180deg); }
  .sel-list {
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:40;
    background:#fff; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden;
    box-shadow:0 10px 15px -3px rgba(0,0,0,.18);
    animation:cal-in .15s ease-out;
  }
  .sel-item { padding:8px 12px; font-size:16px; cursor:pointer; }
  .sel-item:hover { background:#f3f4f6; }

  /* ───── поле даты ───── */
  .date-btn {
    margin-top:6px; height:48px; width:100%; display:flex; align-items:center; justify-content:space-between;
    border-radius:12px; border:1px solid #e5e7eb; background:#fff; padding:0 12px 0 16px;
    text-align:left; cursor:pointer; transition:border-color .2s; color:#1c1c1c;
  }
  .date-btn:hover { border-color:#d1d5db; }
  .date-btn.window { border-color:rgba(47,197,83,.6); }
  .date-text { font-size:16px; color:#d1d5db; }
  .date-text.filled { color:#1c1c1c; font-weight:600; }
  .icon-wrap { width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:#374151; flex:none; }
  .icon-wrap.window { background:rgba(47,197,83,.1); animation:window-pulse 5s ease-in-out infinite; }

  /* ───── календарь ───── */
  .cal {
    margin:4px 4px 16px; border:1px solid #f3f4f6; border-radius:12px; background:#fff; padding:12px;
    box-shadow:0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
    animation:cal-in .15s ease-out;
  }
  @keyframes cal-in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-title { font-size:14px; font-weight:600; color:#111827; }
  .nav-group { display:flex; gap:2px; }
  .nav-btn { width:32px; height:32px; border:none; background:none; border-radius:6px; color:#6b7280; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .nav-btn:hover { background:#f3f4f6; color:#1f2937; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px; }
  .wd { height:28px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; color:#9ca3af; }
  .cell-wrap { display:flex; justify-content:center; }
  .cell {
    width:36px; height:36px; border:none; background:none; border-radius:9999px; font-size:14px;
    display:flex; align-items:center; justify-content:center; cursor:default; color:#9ca3af;
  }
  .cell.selected { background:var(--green); color:#fff; font-weight:700; box-shadow:0 0 0 4px rgba(47,197,83,.2); }
  .cell.today { box-shadow:0 0 0 1px #000; } /* тонкая чёрная рамка на сегодняшней дате */

  /* ───── кнопка «Забронировать» ───── */
  .book-btn {
    position:relative; margin-top:20px; height:48px; width:100%; border:none; border-radius:12px;
    font-size:16px; font-weight:600; color:#fff; display:flex; align-items:center; justify-content:center;
    gap:8px; cursor:not-allowed; background:rgba(47,197,83,.4); overflow:hidden; transition:all .2s;
  }
  .book-btn.active {
    background:var(--green); cursor:pointer;
    box-shadow:0 4px 6px -1px rgba(34,197,94,.25), 0 2px 4px -2px rgba(34,197,94,.25);
  }
  .book-btn.active:hover { background:var(--green-dark); }
  .book-btn.active:active { transform:scale(.99); }
  .btn-spinner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:rgba(255,255,255,.45); }
  .book-label { position:relative; display:flex; align-items:center; gap:8px; }

  .spin { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @keyframes window-pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(47,197,83,.45); }
    50%     { box-shadow:0 0 0 8px rgba(47,197,83,0); }
  }

  /* ───── «Как играть?» ───── */
  .help-btn {
    margin-top:16px; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
    color:#6b7280; background:none; border:none; cursor:pointer;
  }
  .help-btn:hover { color:#374151; }
  .help-list { margin-top:8px; padding-left:20px; font-size:12px; color:#6b7280; line-height:1.625; list-style:decimal; }
  .help-list li { margin-bottom:6px; }

  /* ───── спиннер у курсора ───── */
  .cursor-spinner { position:fixed; left:0; top:0; z-index:100; pointer-events:none; color:#6b7280; display:none; }

  /* ───── диалоги ───── */
  .overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); animation:fade-in .15s ease-out; }
  @keyframes fade-in { from { opacity:0; } to { opacity:1; } }
  .dialog {
    position:fixed; z-index:51; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(384px, calc(100vw - 32px)); background:#fff; border-radius:16px; padding:24px;
    text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,.2), 0 8px 10px -6px rgba(0,0,0,.2);
    animation:dlg-in .15s ease-out;
  }
  @keyframes dlg-in { from { opacity:0; transform:translate(-50%,-50%) scale(.95); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  .dlg-close { position:absolute; right:16px; top:16px; background:none; border:none; color:#6b7280; cursor:pointer; opacity:.7; }
  .dlg-close:hover { opacity:1; }
  .success-circle { margin:8px auto 0; width:64px; height:64px; border-radius:9999px; background:#dcfce7; display:flex; align-items:center; justify-content:center; color:var(--green); }
  .success-title { margin-top:12px; font-size:20px; font-weight:800; }
  .success-desc { color:#6b7280; margin-top:4px; font-size:14px; }
  .pill {
    margin-top:8px; display:inline-flex; align-items:center; gap:4px; border-radius:9999px;
    background:#f0fdf4; padding:4px 12px; font-size:14px; font-weight:600; color:#1F9B41;
    font-variant-numeric:tabular-nums;
  }
  .ok-btn {
    margin-top:16px; height:44px; width:100%; border:none; border-radius:12px;
    background:var(--green); color:#fff; font-weight:600; font-size:16px; cursor:pointer;
  }
  .ok-btn:hover { background:var(--green-dark); }
  .fail-wrap { padding:16px 0; }
  .fail-title { font-size:24px; font-weight:800; color:#f97316; }
  .fail-sub { margin-top:6px; font-size:14px; font-weight:500; color:#9ca3af; }
</style>
</head>
<body>

<!-- спиннер, следующий за курсором -->

<main>
  <section class="card">
    <h1>Бронирование парковки</h1>

    <!-- адрес -->
    <div class="mt16 addr-wrap">
      <label class="label">Выберите адрес</label>
      <button type="button" id="addrTrigger" class="sel-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span id="addrValue">Москва, Кутузовский 32</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>

<script>
"use strict";

/* ───────── константы (как в серверной версии) ───────── */
const WINDOW_MS = 5000;          // окно выбора даты каждую минуту
const BOOK_WINDOW_MS = 2000;     // «Забронировать» успешно только в первые 2000 мс
const LATENCY_TOLERANCE_MS = 200;// допуск на задержку
const SUCCESS_DELAY_MS = 10000;  // спиннер перед успехом
const TIMEOUT_MS = 20000;        // спиннер перед неудачей

const CAR_NUMBER = "Е666КХ77";   // скрыт из интерфейса
const ADDRESSES = ["Москва, Кутузовский 32", "Москва, Вавилова 19"];

const MONTHS_SHORT = ["янв.","февр.","марта","апр.","мая","июня","июля","авг.","сент.","окт.","нояб.","дек."];
const WEEKDAYS = ["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];

/* Три случайных сообщения при неудачной попытке */
const FAIL_MESSAGES = [
  { title: "Request timeout", subtitle: "превышено время на запрос" },
  { title: "Network error", subtitle: "сетевое соединение прервано" },
  { title: "На данную дату закончились места", subtitle: null },
];

/* ───────── состояние ───────── */
const state = {
  phase: "idle",          // idle | selected | sending
  selectedISO: null,
  calOpen: false,
  month: null,            // {y,m}
  address: ADDRESSES[0],
  result: null,
  helpOpen: false,
  addrOpen: false,
};
let calOpenedAt = null;   // календарь должен быть открыт уже после начала окна
let windowOpenAtRef = null;
let prevWindowOpen = false;

const clock = { windowOpen: false, windowOpenAt: 0, msIntoMinute: 0 };

/* ───────── утилиты времени/дат ───────── */
const pad2 = (n) => String(n).padStart(2, "0");
function isoOf(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
function isoOfDay(now) {
  const d = new Date(now);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function targetIso(now) { return isoOfDay(now + 7 * 86_400_000); }
function fmtDMY(iso) { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; }
function buildCells(y, m) {
  const cells = [];
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const dip = new Date(y, m, 0).getDate();
  const pm = m === 0 ? 11 : m - 1, py = m === 0 ? y - 1 : y;
  const nm = m === 11 ? 0 : m + 1, ny = m === 11 ? y + 1 : y;
  for (let i = lead - 1; i >= 0; i--) {
    const d = dip - i;
    cells.push({ d, iso: isoOf(py, pm, d), other: true });
  }
  for (let d = 1; d <= dim; d++) cells.push({ d, iso: isoOf(y, m, d), other: false });
  let nd = 1;
  while (cells.length < 42) { cells.push({ d: nd, iso: isoOf(ny, nm, nd), other: true }); nd++; }
  return cells;
}

/* ───────── звуки (как в приложении) ───────── */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur = 0.08, type = "sine", gain = 0.05, delay = 0) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  } catch { /* звук не критичен */ }
}
const sounds = {
  windowOpen() { tone(880, 0.09, "sine", 0.06); tone(1318, 0.1, "sine", 0.045, 0.06); },
  success()    { tone(659, 0.1, "sine", 0.06); tone(880, 0.1, "sine", 0.06, 0.09); tone(1174, 0.18, "sine", 0.06, 0.18); },
  fail()       { tone(233, 0.22, "sawtooth", 0.035); tone(185, 0.3, "sawtooth", 0.035, 0.18); },
  click()      { tone(520, 0.04, "square", 0.02); },
};
window.addEventListener("pointerdown", initAudio, { once: true });
window.addEventListener("keydown", initAudio, { once: true });

/* ───────── svg-иконки (lucide) ───────── */
const svg = (paths, size, cls = "") =>
  `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
const IC = {
  chevLeft:  (s) => svg('<path d="m15 18-6-6 6-6"/>', s),
  chevRight: (s) => svg('<path d="m9 18 6-6-6-6"/>', s),
  chevsLeft: (s) => svg('<path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/>', s),
  chevsRight:(s) => svg('<path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/>', s),
  loader:    (s) => svg('<path d="M21 12a9 9 0 1 1-6.219-8.56"/>', s, "spin"),
  check:     (s) => svg('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', s),
  zap:       (s) => svg('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>', s),
  x:         (s) => svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', s),
};

/* ───────── dom ───────── */
const $ = (id) => document.getElementById(id);
const el = {
  addrTrigger: $("addrTrigger"), addrValue: $("addrValue"), addrList: $("addrList"),
  dateBtn: $("dateBtn"), dateText: $("dateText"), calIconWrap: $("calIconWrap"),
  calendar: $("calendar"), bookBtn: $("bookBtn"), btnSpinner: $("btnSpinner"),
  helpBtn: $("helpBtn"), helpList: $("helpList"),
  cursorSpinner: $("cursorSpinner"), overlay: $("dlgOverlay"), dlg: $("dlg"),
};

/* ───────── часы: минутное окно ───────── */
function tickClock() {
  const now = Date.now();
  const woa = Math.floor(now / 60000) * 60000;
  const ms = now - woa;
  clock.windowOpenAt = woa;
  clock.msIntoMinute = ms;
  const open = ms <= WINDOW_MS;
  if (open !== clock.windowOpen || open !== prevWindowOpen) {
    const rising = open && !clock.windowOpen;
    clock.windowOpen = open;
    if (rising) {
      prevWindowOpen = true;
      sounds.windowOpen();
      state.month = targetMonth();
      renderCalendar();
    } else if (!open) {
      prevWindowOpen = false;
    }
    renderDateField();
    if (state.calOpen) renderCalendar();
  }
}
setInterval(tickClock, 16);
tickClock();

function targetMonth() {
  const [y, m] = targetIso(Date.now()).split("-").map(Number);
  return { y, m: m - 1 };
}
function isWindowActivePhase() { return clock.windowOpen && state.phase === "idle"; }
function isDateActive() {
  return isWindowActivePhase() && calOpenedAt != null && calOpenedAt >= clock.windowOpenAt;
}

/* ───────── адрес (кастомный селект) ───────── */
function renderAddrList() {
  el.addrList.innerHTML = ADDRESSES.map((a) =>
    `<div class="sel-item" role="option" data-addr="${a}">${a}</div>`
  ).join("");
}
renderAddrList();
el.addrTrigger.addEventListener("click", (e) => {
  e.stopPropagation();
  state.addrOpen = !state.addrOpen;
  el.addrList.style.display = state.addrOpen ? "block" : "none";
  el.addrTrigger.classList.toggle("open", state.addrOpen);
  el.addrTrigger.setAttribute("aria-expanded", state.addrOpen);
  sounds.click();
});
el.addrList.addEventListener("click", (e) => {
  const item = e.target.closest("[data-addr]");
  if (!item) return;
  state.address = item.dataset.addr;
  el.addrValue.textContent = state.address;
  state.addrOpen = false;
  el.addrList.style.display = "none";
  el.addrTrigger.classList.remove("open");
  el.addrTrigger.setAttribute("aria-expanded", "false");
  sounds.click();
});
document.addEventListener("click", (e) => {
  if (state.addrOpen && !el.addrTrigger.contains(e.target) && !el.addrList.contains(e.target)) {
    state.addrOpen = false;
    el.addrList.style.display = "none";
    el.addrTrigger.classList.remove("open");
    el.addrTrigger.setAttribute("aria-expanded", "false");
  }
});

/* ───────── поле даты ───────── */
function renderDateField() {
  const filled = state.phase !== "idle" && state.selectedISO != null;
  el.dateText.textContent = filled ? fmtDMY(state.selectedISO) : "Нет свободных мест";
  el.dateText.classList.toggle("filled", filled);
  const win = isWindowActivePhase();
  el.dateBtn.classList.toggle("window", win);
  el.calIconWrap.classList.toggle("window", win);
}

/* ───────── календарь ───────── */
function renderCalendar() {
  if (!state.calOpen || !state.month) { el.calendar.style.display = "none"; el.dateBtn.setAttribute("aria-expanded", "false"); return; }
  el.calendar.style.display = "block";
  el.dateBtn.setAttribute("aria-expanded", "true");
  const { y, m } = state.month;
  const targetISO = targetIso(Date.now());
  const todayISO = isoOfDay(Date.now());
  const dateActive = isDateActive();
  let html = `
    <div class="cal-head">
      <div class="nav-group">
        <button type="button" class="nav-btn" aria-label="Предыдущий год" data-nav="y-">${IC.chevsLeft(16)}</button>
        <button type="button" class="nav-btn" aria-label="Предыдущий месяц" data-nav="m-">${IC.chevLeft(16)}</button>
      </div>
      <div class="cal-title">${MONTHS_SHORT[m]} ${y}</div>
      <div class="nav-group">
        <button type="button" class="nav-btn" aria-label="Следующий месяц" data-nav="m+">${IC.chevRight(16)}</button>
        <button type="button" class="nav-btn" aria-label="Следующий год" data-nav="y+">${IC.chevsRight(16)}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${WEEKDAYS.map((w) => `<div class="wd">${w}</div>`).join("")}
  `;
  for (const c of buildCells(y, m)) {
    const isTarget = c.iso === targetISO && !c.other;
    const isSelected = c.iso === state.selectedISO && !c.other;
    const isToday = c.iso === todayISO && !c.other;
    const clickable = isTarget && dateActive;
    // все даты — ровно одинаковый серый; зелёной становится только выбранная (по клику),
    // сегодняшняя — с тонкой чёрной рамкой
    const cls = isSelected ? "cell selected" : isToday ? "cell today" : "cell";
    html += `
      <div class="cell-wrap">
        <button type="button" class="${cls}" aria-label="${c.d} ${MONTHS_SHORT[m]} ${y}"
          data-iso="${c.iso}" ${clickable ? "" : "disabled"}>${c.d}</button>
      </div>`;
  }
  html += "</div>";
  el.calendar.innerHTML = html;
}

el.dateBtn.addEventListener("click", () => {
  state.calOpen = !state.calOpen;
  if (state.calOpen) {
    // дата активна только если календарь открыт уже после начала текущего окна
    calOpenedAt = Date.now();
    state.month = targetMonth();
  }
  sounds.click();
  renderCalendar();
});

el.calendar.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const { y, m } = state.month;
    if (nav.dataset.nav === "y-") state.month = { y: y - 1, m };
    if (nav.dataset.nav === "y+") state.month = { y: y + 1, m };
    if (nav.dataset.nav === "m-") state.month = { y, m: m === 0 ? 11 : m - 1 };
    if (nav.dataset.nav === "m+") state.month = { y, m: m === 11 ? 0 : m + 1 };
    renderCalendar();
    return;
  }
  const cell = e.target.closest("[data-iso]");
  if (!cell || cell.disabled) return; // чужие/неактивные даты: ничего не происходит
  selectTarget(cell.dataset.iso);
});

function selectTarget(iso) {
  const now = Date.now();
  if (now % 60000 > WINDOW_MS) return;                 // только в окно
  const woa = Math.floor(now / 60000) * 60000;
  if (calOpenedAt == null || calOpenedAt < woa) return; // календарь открыт в окно
  const targetISO = targetIso(now);
  if (iso !== targetISO) return;                        // чужая дата — ничего
  windowOpenAtRef = woa;
  state.selectedISO = iso;
  state.phase = "selected";
  state.calOpen = false;
  sounds.click();
  renderCalendar();
  renderDateField();
  renderBookBtn();
}

/* Escape закрывает календарь */
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.calOpen) {
    state.calOpen = false;
    renderCalendar();
  }
});

/* ───────── кнопка «Забронировать» ───────── */
function renderBookBtn() {
  const active = state.phase !== "idle";
  el.bookBtn.disabled = !active;
  el.bookBtn.classList.toggle("active", active);
  el.btnSpinner.style.display = state.phase === "sending" ? "flex" : "none";
  el.cursorSpinner.style.display = state.phase === "sending" ? "block" : "none";
}

el.bookBtn.addEventListener("click", () => {
  if (state.phase !== "selected" || !state.selectedISO || windowOpenAtRef == null) return;
  pressBook();
});

function pressBook() {
  const now = Date.now();
  const reactionMs = Math.max(0, Math.round(now - windowOpenAtRef));
  const sentWindowOpenAt = windowOpenAtRef;
  const sentDate = state.selectedISO;
  state.phase = "sending";
  renderBookBtn();
  renderDateField();

  /* Проверка «сервера» (локальная копия логики /api/book):
     успех — запрос в то же минутное окно и не позже 1500 мс (+200 мс допуск) */
  const msIntoMinute = now % 60000;
  const currentWindowOpenAt = Math.floor(now / 60000) * 60000;
  const inSuccess =
    sentWindowOpenAt === currentWindowOpenAt &&
    msIntoMinute <= BOOK_WINDOW_MS + LATENCY_TOLERANCE_MS &&
    sentDate === targetIso(now);

  const finish = () => {
    if (inSuccess) {
      state.result = { type: "success", booking: { carNumber: CAR_NUMBER, address: state.address, date: sentDate }, reactionMs };
      sounds.success();
    } else {
      const m = FAIL_MESSAGES[Math.floor(Math.random() * FAIL_MESSAGES.length)];
      state.result = { type: "fail", title: m.title, subtitle: m.subtitle };
      sounds.fail();
    }
    // как в приложении: поле сбрасывается, диалог открыт
    state.phase = "idle";
    state.selectedISO = null;
    windowOpenAtRef = null;
    renderBookBtn();
    renderDateField();
    renderDialog();
  };
  setTimeout(finish, inSuccess ? SUCCESS_DELAY_MS : TIMEOUT_MS);
}

/* спиннер следует за курсором */
window.addEventListener("mousemove", (e) => {
  if (state.phase === "sending") {
    el.cursorSpinner.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 16}px)`;
  }
});

/* ───────── «Как играть?» ───────── */
el.helpBtn.addEventListener("click", () => {
  state.helpOpen = !state.helpOpen;
  el.helpList.style.display = state.helpOpen ? "block" : "none";
});

/* ───────── диалоги результата ───────── */
function renderDialog() {
  const r = state.result;
  if (!r) {
    el.overlay.style.display = "none";
    el.dlg.style.display = "none";
    return;
  }
  el.overlay.style.display = "block";
  el.dlg.style.display = "block";
  if (r.type === "success") {
    el.dlg.innerHTML = `
      <button type="button" class="dlg-close" aria-label="Закрыть">${IC.x(16)}</button>
      <div class="success-circle">${IC.check(36)}</div>
      <div class="success-title">Парковка забронирована</div>
      <div class="success-desc">${r.booking.address} · ${fmtDMY(r.booking.date)}</div>
      <div class="pill">${IC.zap(14)} Реакция: ${r.reactionMs} мс</div>
      <button type="button" class="ok-btn">Отлично</button>
    `;
  } else {
    el.dlg.innerHTML = `
      <div class="fail-wrap">
        <div class="fail-title">${r.title}</div>
        ${r.subtitle ? `<div class="fail-sub">${r.subtitle}</div>` : ""}
      </div>
    `;
  }
}

function closeDialog() { state.result = null; renderDialog(); }
el.overlay.addEventListener("click", closeDialog);
el.dlg.addEventListener("click", (e) => {
  if (e.target.closest(".dlg-close") || e.target.closest(".ok-btn")) closeDialog();
});
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.result) closeDialog();
});

/* ───────── первичный рендер ───────── */
renderDateField();
renderBookBtn();
renderCalendar();
</script>
</body>
</html>
